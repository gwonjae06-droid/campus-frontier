name: Restore Campus Frontier sources
on:
  push:
    paths:
      - '.bootstrap/03.base64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and test source archive
        run: |
          cat .bootstrap/0*.base64 | base64 --decode > /tmp/campus-frontier.tar.xz
          tar -xJf /tmp/campus-frontier.tar.xz -C .
          node --test test.mjs
      - name: Commit full game sources
        run: |
          rm -rf .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "feat: add playable Campus Frontier mobile alpha v0.1.1"
          git push
